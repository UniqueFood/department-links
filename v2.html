لاختبارات وتغييرات الأسعار."]]], "tb": [{"t": "النماذج المعتمدة بين الأقسام", "cols": ["الرمز", "النموذج", "الغرض"], "rows": [["FRM-MKT-01", "نموذج ملخص الشهر السابق والشهر القادم", "توحيد عرض نتائج الشهر السابق من حيث الحملات، والعروض، ومحتوى السوشال ميديا، والمبيعات والأثر"], ["FRM-MKT-02", "نموذج خطة السوشال ميديا وطريقة الصور والفيديوات في الانستغرام والتيك توك", "—"], ["FRM-MKT-03", "نموذج دراسة المنافسين والأصناف", "نموذج فيه المنافسين والأصناف والملاحظات والتحسينات المقترحة"], ["FRM-MKT-04", "نموذج لجميع الأيام السنوية وارسالها للإدارة في شهر December من كل سنة", "جميع الأيام العالمية والأيام المهمة (كاس العالم، كاس اسيا الخ....)"], ["FRM-MKT-05", "تعميد نموذج السيناريو المرتبط بالحملة والهدف", "تنظيم بيانات المعلن أو المؤثر، ونوع التعاون، المطلوب"], ["FRM-MKT-06", "نموذج موحد طلب اي حملة أو عرض (موافقة من الادارة)", "توثيق فكرة الحملة أو العرض وهدفها والجهة المستفيدة والفترة المقترحة وإرسال النموذج للمالية بعد اعتماد الادارة"], ["FRM-MKT-07", "نموذج اعتماد تصميم باكج جديد أو تعديل وتوقيع (مع قسم المشتريات)", "توثيق اعتماد التصاميم (توقيع المشتريات والتسويق والادارة)"], ["FRM-MKT-08", "نموذج حملة افتتاح براند جديد / فرع جديد", "توثيق خطة افتتاح براند جديد وموادها وجدولها"], ["FRM-MKT-09", "نموذج منتج جديد / اختبار / تطوير منتج / تغيير سعر (يرسل للقسم المعني ومختوم من الادارة)", "—"]]}, {"t": "الملفات والسجلات المحفوظة", "cols": ["الرمز", "الملف", "الغرض"], "rows": [["FILE-MKT-01", "ملف يجمع جميع التقارير التسويقية أعلاه", "ملف لحفظ جميع التقارير والخطط الشهرية على حدى لكل شهر لكل براند"], ["FILE-MKT-02", "ملف فيه جميع ملفات الصور والفيديوات (مع قسم خدمة العملاء)", "ملف يجمع جميع الصور المصورة والتصاميم السابقة لكل براند"], ["FILE-MKT-03", "ملف يجمع جميع الحملات والعروض لكل براند بكل شهر", "الهدف انه اي وقت تطلب الادارة شوف شي سابق يكون الملف موجود"], ["FILE-MKT-04", "ملف يجمع جميع المعلنين", "حصر المعلنين والمؤثرين وعدد المتابعين والمنصة واي براند تم التعامل معهم سابقا"]]}]},supply:{"t": "التزامات قسم المشتريات داخليًا", "g": [["التقارير والأداء وإدارة الموردين", ["إعداد التقارير الدورية المعتمدة في مواعيدها، وتوثيق الفروقات والانحرافات والملاحظات الرقابية والإجراءات اللازمة لمعالجتها، وحفظ ملف محدث للتقارير.", "تقييم أداء موظفي القسم شهريًا.", "تحديد المشرف البديل عند غياب مدير سلسلة الإمداد، والإبلاغ عنه ببريد رسمي.", "إعداد وتحديث ملفات Excel تشمل الموردين وعقودهم ومواعيد انتهائها، والمنتجات وأسعارها والموردين المتاحين في كل مدينة."]], ["الأنظمة والتخطيط والتوريد والمستودعات", ["إنشاء أكواد المنتجات وتعديلها، وتجهيز النظام للفروع الجديدة قبل التشغيل.", "تحديث بيانات المنتجات وصورها وأسعارها، وتوحيد أسماء الفروع بالعربية أو الإنجليزية، وتحديث ملف المنتجات وصور الداي كت لكل مطعم دوريًا.", "تسجيل طلبات المستثمرين وتحويلها عبر فودكس.", "توقع الطلب وإعداد خطة توريد ربع سنوية، وإعداد خطة مشتريات للسنة الجديدة وتحديثها كل 3 أشهر وإرسالها رسميًا للإدارة.", "متابعة توفر المواد في الفروع، وإبلاغ محاسب الامتياز ومدير التشغيل ورئيس العمليات بأي نقص عبر البريد.", "التحقق من جودة الأصناف المستلمة ومطابقة أسعارها للعقود.", "تعيين بديل لمسؤول المستودع والإبلاغ عنه رسميًا، وتنظيم المستودع والتخزين وفق مبدأ الوارد أولًا يُصرف أولًا (FIFO)، وتنفيذ الزيارات والمتابعة الميدانية والجرد الشهري.", "إصدار أوامر الشراء بعد توقيع الإدارة فقط."]], ["طلبات الشراء والتجهيز والاعتماد المالي", ["استلام طلبات المواد التشغيلية والتسويقية والتغليف عبر بريد رسمي قبل الحاجة إليها بـ 3 أسابيع على الأقل، واستلام طلبات التسويق مكتملة البيانات.", "إعداد أوامر الشراء وإرسالها للموردين بعد اعتماد السعر من الإدارة، وتوقيع نموذج اعتماد العينة عند وجود عينات.", "اعتماد التغليف من الإدارة قبل إرساله للموردين لبدء الطباعة.", "تجهيز مشتريات الفروع الجديدة وطلبات الافتتاح وتحديثات فودكس، بشرط استلام الطلبات قبلها بـ 3 أسابيع على الأقل.", "تنفيذ تحويلات الفروع وتسليم الطلبات المحوّلة، ومتابعة الإيجارات والالتزامات المرتبطة بالمواقع وتجهيز الإنترنت للفروع الجديدة بالتنسيق مع الجهة التشغيلية.", "إرسال فواتير فودكس وكشوفات الحساب الشهرية، وتصفية العُهد في الأيام المحددة.", "الالتزام بحدود الاعتماد المالي للمشتريات والتزامات الشراء."]]], "tb": [{"t": "النماذج المعتمدة بين الأقسام", "cols": ["الرمز", "النموذج", "الغرض"], "rows": [["FRM-PROC-01", "نموذج تقرير الاستلامات بالمستودع", "توثيق الاستلامات وما يرتبط بها من كميات وحالات وملاحظات"], ["FRM-PROC-02", "نموذج تقرير التحقق من المخزون الفعلي ومخزون Foodics والفروقات (انحراف التوقع)", "ضبط الفروقات بين الرصيد الفعلي والرصيد النظامي"], ["FRM-PROC-03", "نموذج تقرير ملخص زيارة معرض", "توثيق نتائج الزيارة والفرص والعينات والملاحظات"], ["FRM-PROC-04", "نموذج خطة المشتريات السنوية", "بناء الخطة السنوية وربطها بالميزانية والتوسع والاحتياج"], ["FRM-PROC-05", "نموذج Excel بكل أصناف المطاعم بالمقاسات والداي كت", "تجهيز نموذج لكل مطعم بأصناف الباكجنق و المقاسات والداي كت"], ["FRM-PROC-06", "طلب عرض سعر (RFQ) - يجب توقيعه من الادارة", "توحيد طلبات عروض الأسعار"], ["FRM-PROC-07", "نموذج مقارنة عروض الموردين مع كل مدينة", "توثيق المقارنة بين الأسعار والشروط"], ["FRM-PROC-08", "نموذج تعميد عينة لل Packaging - يجب توقيعه من الإدارة والتسويق", "توقيع النموذج عند الاعتماد"], ["FRM-PROC-09", "نموذج تنظيم مواقع التخزين وترتيبها بكل فرع ومستودع (مع قسم التشغيل)", "ضبط توزيع المواد داخل المستودع وتحديد مواقعها وترتيبها (وارسال ايميل رسمي)"], ["FRM-PROC-10", "نموذج توقيع موظف المستودع للاستلام", "يجب توقيع الموظف وارسال الخطاب بشكل دوري"]]}, {"t": "الملفات والسجلات المحفوظة", "cols": ["الرمز", "الملف", "الغرض"], "rows": [["FILE-PROC-01", "ملف جميع العقود والاتفاقيات الشرائية", "حفظ العقود جميعها بملف واحد"]]}]},operations:{"t": "التزامات قسم التشغيل داخليًا", "g": [["متابعة الأداء والتقارير", ["إعداد التقارير اليومية والأسبوعية والشهرية، ومتابعة مبيعات الفروع وتحليل أسباب ارتفاعها وانخفاضها.", "الحفاظ على تقييم 4.5 في قوقل ماب وتطبيقات التوصيل، وتقييم أداء مديري المناطق والفروع وفق مؤشرات الأداء المعتمدة والموزعة عليهم.", "عقد اجتماع تشغيلي أسبوعي بمشاركة المشتريات، وتوثيق المشكلات وأسبابها والقرارات المتخذة.", "عقد اجتماع أسبوعي مع الإدارة كل يوم أربعاء."]], ["الاحتياجات التشغيلية وجاهزية الفروع", ["إعداد طلبات المواد الغذائية والتشغيلية وفق الاحتياج", "تدريب موظفي الفروع على التغليف (Packaging)", "التحقق من استلام إشعار الإنشاءات الأول قبل انتهاء أعمال الفرع بأسبوعين، والإشعار الثاني عند اكتمالها فعليًا، وربطهما بمراجعة الجاهزية التشغيلية.", "إرسال ايميل رسمي لجميع الشركة قبل افتتاح أي فرع جديد لضمان التنسيق والجاهزية", "متابعة تعليقات Google Maps  المتعلقة بالتشغيل بصورة منتظمة.", "متابعة الأعطال والصيانة وربطها بمؤشرات أداء الموظفين والفروع."]], ["شؤون الموظفين والالتزام التشغيلي", ["متابعة حضور موظفي التشغيل وانصرافهم وتقييم أدائهم وربطه بأداء الفروع.", "متابعة تجديد الشهادات الصحية والتأكد من سلامة الحالة النظامية للموظفين.", "التنسيق مع الفروع لتنفيذ التصحيحات اللازمة، ورصد الحالات المتكررة أو الجوهرية ورفعها للجهة المختصة."]], ["الوصفات والمنتجات والحملات", ["حفظ سجل موحد للوصفات والملفات التشغيلية لجميع المطاعم، وتحديثه وإرساله دوريًا.", "دراسة المنتجات الجديدة أو القابلة للتطوير.", "استلام خطط الحملات الإعلانية والفعاليات والمنتجات الجديدة والعروض من التسويق قبل التنفيذ بـ 10 أيام على الأقل، وربطها بتقييم تشغيلي واضح."]]], "tb": [{"t": "النماذج المعتمدة بين الأقسام", "cols": ["الرمز", "النموذج", "الغرض"], "rows": [["FRM-OPS-01", "نموذج استلامات الكاش في المطعم وتسليمها للمالية", "توثيق الاستلامات اليومية أو الدورية وربطها بالفرع والتاريخ"], ["FRM-OPS-02", "نموذج الملفات التشغيلية لكل براند، SOP + Operational Manual", "الملف يتحدث كل مرة يتغير فيه أي شيء"], ["FRM-OPS-03", "نموذج بلاغ عطل تشغيلي", "توثيق العطل، وموقعه، ووصفه، ودرجة تأثيره، والجهة المبلغة، ووقت البلاغ ووقت التنفيذ"]]}]},hr:{t:'التزامات قسم الموارد البشرية داخليًا',g:[["شؤون الموظفين والتوظيف", ["متابعة الحضور والانصراف عبر البصمة، وتنظيم تسليم العُهد واستلامها وفق النماذج والسجلات المعتمدة.", "إعداد الرواتب ومتابعة التأمينات الاجتماعية وفواتيرها وشهاداتها، والتأمين الصحي ومستحقات الإجازات.", "استقبال السير الذاتية وتنظيمها وربطها بالوظائف المتاحة، وفرز المرشحين حسب متطلبات الوظيفة.", "تنسيق المقابلات وتحديد مواعيدها ومتابعة حضور المرشحين، وتوثيق النتائج والملاحظات والتوصيات وحفظ بياناتهم."]], ["التراخيص والسجلات والاشتراكات", ["متابعة معاملات مركز الأعمال، بما يشمل باركود التوصيل المنزلي وتجديد السجلات التجارية والتفويضات.", "إصدار وتجديد رخص المطاعم عبر منصة بلدي ومتابعة المخالفات البلدية.", "تحديث الحسابات البنكية عبر الأهلي إي كورب.", "متابعة رسوم إصدار وتجديد الرخص وإشعار المالية بها.", "إصدار رموز QR وربطها بالفروع، ومتابعة اشتراكات سبل ووافق وتجديدها.", "إرسال الفواتير الشهرية للجهات المعتمدة بصورة منتظمة وموثقة.", "حفظ سجل محدث للتراخيص والسجلات والاشتراكات والشهادات والإقرارات والفواتير والمخالفات ومواعيد انتهائها."]], ["العقود والإقامات والاستقدام", ["إعداد عقود الموظفين ومراجعة اكتمال بياناتها وربطها بالوضع الوظيفي، وتحديث بيانات منصة قوى ومتابعة اشتراكها والموافقة على العقود وتجديد رخص العمل.", "معالجة طلبات تأشيرات الاستقدام للتشغيل عبر مواردكم، ومتابعة الإقامات وتأشيرات الخروج والعودة.", "متابعة إصدار وتجديد الإقامات والرخص قبل انتهائها بمدة كافية، وتحديث بيانات منصة مقيم وتجديد اشتراكها.", "تقديم طلبات الإقامة والتأشيرات والسفر والحجز رسميًا عبر النموذج المعتمد وإرسالها إلى بريد الموارد البشرية.", "متابعة اشتراكات الغرف التجارية وتجديدها والتصديقات المرتبطة بها."]]],tb:[{"t": "النماذج المعتمدة بين الأقسام", "cols": ["الرمز", "النموذج", "الغرض"], "rows": [["FRM-HR-01", "نموذج التعريف باللوائح والأنظمة", "توثيق تعريف الموظفين باللوائح والأنظمة والتعليمات المعتمدة"], ["FRM-HR-02", "نموذج مخالفة لموظف أو بلدية، أو إشعار إجراء انضباطي", "توثيق المخالفة أو الحالة وربطها بالتاريخ والواقعة والموظف المعني وتوقيعه"], ["FRM-HR-03", "نموذج إعداد مقابلة وظيفية وتقييم المقابلة", "تنظيم مواعيد المقابلات والمرشحين والجهات المشاركة في التقييم"], ["FRM-HR-04", "نموذج طلب جهاز نقاط بيع", "توثيق طلبات أجهزة نقاط البيع وربطها بالفرع وتاريخ واسم المطعم"]]}, {"t": "الملفات والسجلات المحفوظة", "cols": ["الرمز", "الملف", "الغرض"], "rows": [["FILE-HR-01", "ملف فيه القرارات الوظيفية والوصف الوظيفي", "ملف شامل للموظفين يشمل القرارات الوظيفية والوصف الوظيفي"], ["FILE-HR-02", "ملف لجميع العقود للموظفين، والمطاعم، أي شيء يخص الموارد البشرية بالعقود ومواردكم", "حفظ العقود بملف"], ["FILE-HR-03", "ملف يجمع السير الذاتية والمرشحين والتقييمات كلها", "حفظ السير الذاتية المصنف var BDR=/(قبل التنفيذ بـ 10 أيام على الأقل|بأسبوعين|كل يوم أربعاء|اليومية والأسبوعية والشهرية|اليومية أو الدورية|قبل انتهائها بمدة كافية|اجتماع تشغيلي أسبوعي|اجتماع أسبوعي|الفواتير الشهرية|دوريًا|بصورة منتظمة|في ديسمبر من كل سنة|في شهر December من كل سنة|للأشهر الثلاثة القادمة|الأيام الخمسة السابقة|الأيام الخمسة التالية|بـ أسبوع إلى 3 أسابيع|خلال أسبوع إلى 10 أيام|الأشهر الثلاثة القادمة|خلال ساعة واحدة|خلال 4 ساعات عمل|لمدة 30 يومًا|ملف شهري|قبل الافتتاح بعشرة أيام على الأقل|مرتين أسبوعيًا، يومي الأحد والأربعاء|كل 3 أشهر|ربع سنوية|بـ 3 أسابيع على الأقل|بشكل دوري|شهريًا|الشهرية)/g;

function admTxt(d){var X=ADMTXT[d.k];if(!X)return '';return (X.g&&X.g.length?'<h3 class="admh">'+esc(X.t)+':</h3><div class="admg'+(X.g.length===4?' g4':'')+'">'+X.g.map(function(g){return '<div class="adm admt">'+(g[0]?'<h4>'+esc(g[0])+'</h4>':'')+'<'+(g[2]?'ol':'ul')+'>'+g[1].map(function(s){return '<li>'+bd(s)+'</li>';}).join('')+'</'+(g[2]?'ol':'ul')+'></div>';}).join('')+'</div>':'')+(X.tb||[]).map(function(x){return '<div class="adm admw"><h3>'+esc(x.t)+'</h3><div class="tw"><table><thead><tr>'+x.cols.map(function(c){return '<th>'+esc(c)+'</th>';}).join('')+'</tr></thead><tbody>'+x.rows.map(function(r){return '<tr>'+r.map(function(c,i){return '<td'+(i===0?' dir="ltr" class="ap"':'')+'>'+bd(c).replace(/\n/g,'<br>')+'</td>';}).join('')+'</tr>';}).join('')+'</tbody></table></div></div>';}).join('');}
function tabAdm(d){
 var L=ADM[d.k];
 if(!L&&ADMTXT[d.k])return admTxt(d);
 if(!L)return '<div class="empty"><b>الصلاحيات الإدارية لقسم '+esc(d.ar)+'</b><br>جداول حدود الاعتماد، قيد التجهيز وبتظهر هنا قريباً.</div>';
 return L.map(function(x){
  return '<div class="adm"><h3>'+esc(x.t)+'</h3><div class="tw"><table><thead><tr>'+x.cols.map(function(c){return '<th>'+esc(c)+'</th>';}).join('')+'</tr></thead><tbody>'+x.rows.map(function(r){return '<tr>'+r.map(function(c,i){return '<td'+(i===2?' dir="ltr" class="ap"':'')+'>'+esc(c)+'</td>';}).join('')+'</tr>';}).join('')+'</tbody></table></div></div>';
 }).join('')+admTxt(d);
}
function dept(dk,tab,n,sec){
 var d=BY[dk];if(!d){go('');return;}
 var tabs=tabsFor(dk).map(function(t){return t[0];});
 if(tabs.indexOf(tab)<0)tab=tabs[0];
 var h=pageHead(d,tab);
 if(tab==='pol')h+=tabPol(d);else if(tab==='all')h+=tabAll(d,n);else if(tab==='coord')h+=tabCoord(d);else if(tab==='rel')h+=tabRel(d);else if(tab==='forms')h+=tabForms(d);else if(tab==='adm')h+=tabAdm(d);else if(/^p\d+$/.test(tab))h+=tabAll(d,n,parseInt(tab.slice(1),10));else h+=tabRep(d);
 $('view').innerHTML=h+'</div>';
 renderNav(dk);renderWho();
 var om=$('om');if(om)om.onchange=function(){onlyMine=om.checked;route();};
 if(n!=null){var el=$('it-'+dk+'-'+n);if(el){el.scrollIntoView({block:'center'});el.classList.add('flash');}}
 else if(sec!=null){var se=$('sec-'+dk+'-'+sec);if(se){se.scrollIntoView({block:'start'});window.scrollBy(0,-70);}}
 else window.scrollTo(0,0);
}
function go(p){if(location.hash==='#/'+p)route();else location.hash='#/'+p;}
function route(){
 document.body.classList.remove('open');
 var p=location.hash.replace(/^#\/?/,'').split('/');
 if(p[0]==='reports'){reportsView(p[1]||null);return;}
 if(p[0]==='r'&&p[1]){roleView(decodeURIComponent(p[1]));return;}
 if(!p[0]||p[0]==='home'){homeView();return;}
 var sx=p[2]&&/^s\d+$/.test(p[2])?parseInt(p[2].slice(1),10):null;
 dept(p[0],p[1]||null,(p[2]!=null&&sx==null)?parseInt(p[2],10):null,sx);
}
window.addEventListener('hashchange',route);
$('burger').onclick=function(){document.body.classList.toggle('open');};
$('scrim').onclick=function(){document.body.classList.remove('open');};

var q=$('q'),sr=$('sres');
function doSearch(){
 var v=q.value.trim().toLowerCase(),h='',n=0;
 var ds=DEPTS.filter(function(d){return !v||d.ar.toLowerCase().indexOf(v)>=0||(d.en||'').toLowerCase().indexOf(v)>=0;});
 if(ds.length){h+='<div class="sh">الأقسام</div>'+ds.map(function(d){return '<a class="sd" href="#/'+d.k+'"><b>'+esc(d.ar)+'</b> <small>'+esc(d.en||'')+'</small></a>';}).join('');n+=ds.length;}
 var rs=M.roles.filter(function(r){return !v||r.n.toLowerCase().indexOf(v)>=0;});
 if(rs.length){h+='<div class="sh">المسميات الوظيفية</div>'+rs.map(function(r){return '<a href="#/r/'+encodeURIComponent(r.n)+'"><b>'+esc(r.n)+'</b> <small>'+esc(dpName(r.h))+'</small></a>';}).join('');n+=rs.length;}
 if(v.length>=2){
  var out=[];
  DEPTS.forEach(function(d){d.items.forEach(function(i){if(out.length>=8)return;if(i.t.toLowerCase().indexOf(v)>=0)out.push([d,i]);});});
  if(out.length){h+='<div class="sh">المهام</div>'+out.map(function(o){return '<a href="'+href(o[0].k,'all',o[1].n)+'"><small>'+esc(o[0].ar)+' · #'+o[1].n+'</small><br>'+esc(o[1].t.split('\n')[0])+'</a>';}).join('');n+=out.length;}
 }
 sr.innerHTML=n?h:'<a>ما لقينا نتائج</a>';
 sr.style.display='block';
}
q.addEventListener('input',doSearch);q.addEventListener('focus',doSearch);
document.addEventListener('keydown',function(e){if(e.key==='Escape'){sr.style.display='none';q.blur();}});
document.addEventListener('click',function(e){if(!e.target.closest('.search'))sr.style.display='none';else if(e.target.closest('.sres a[href]')){sr.style.display='none';q.value='';}});
route();
})();
